plugins {
   id 'java'
}


repositories {
    mavenCentral()
}


java {
    sourceCompatibility = JavaVersion.toVersion(21)
    targetCompatibility = JavaVersion.toVersion(21)
}


dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.0'
    testImplementation 'org.hamcrest:hamcrest:3.0'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
        }
}

task copyDocs (type: Copy, dependsOn: 'javadoc') {
    from 'build/docs'
    into 'build/reports'
}

task reports (dependsOn: ['copyDocs', 'test']) {}

////////  Website publication on GitHub pages ///////////////////

def pagesDir = file("${project.rootDir}/build/website-temp").absolutePath

task clearPages(type: Delete) {
    delete pagesDir
}

task workTree(dependsOn: ['clearPages']) { 
    doLast {
        exec {
            workingDir = '.'
            commandLine = ['git', 'worktree', 'add', '-f', pagesDir, 'gh-pages']
        }
        exec {
            workingDir = pagesDir
            commandLine = ['git', 'checkout', 'gh-pages']
        }
        exec {
            workingDir = pagesDir
            commandLine = ['git', 'pull']
        }
    }
}




////////  Website publication on GitHub pages ///////////////////

task copyReports (type: Copy, dependsOn: ['reports', 'workTree']) {
    from 'build/reports'
    into pagesDir
}

task copyReadMe (type: Copy, dependsOn: ['workTree']) {
    from '../README.md'
    into pagesDir
}

task copyLicense (type: Copy, dependsOn: ['workTree']) {
    from '../LICENSE.md'
    into pagesDir
}

task copyWebsite (type: Copy, dependsOn: ['copyReports', 'copyReadMe', 'copyLicense']) {
    from file('src/main/html')
    into pagesDir
}

task commitWebsite (dependsOn: 'copyWebsite') {
    doLast {
        Date now = new Date()

        exec {
            workingDir = pagesDir
            commandLine = ['git', 'add', pagesDir]
            ignoreExitValue = true
        }
        exec {
            workingDir = pagesDir
            commandLine = ['git', 'commit', '-m', 'Updating webpages at ' + now.toString()]
            ignoreExitValue = true
        }
    }
}

task pushWebsite (type: Exec, dependsOn: 'commitWebsite') {
    workingDir = pagesDir
    commandLine = ['git', 'push']
    ignoreExitValue = true
}

task deployReports (type: Delete, dependsOn: 'pushWebsite') {
    group = "Reporting"
    description  'Commit and push website changes to GitHub'
    delete pagesDir
}


